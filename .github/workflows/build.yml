name: Build Archive Index
on:
  push:
    branches:
      - main
    paths:
      - '**/info.json'
      - '**/.meta.json'
      - '**/preview.*'
      - '**/*.litematic'
      - '**/*.zip'
      - '**/*.rar'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      force_images:
        description: '强制重建全部预览图与缩略图（忽略 _meta/image-cache.json 的内容哈希缓存）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: archive-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
      - name: Force Rebuild Images
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_images == 'true'
        run: rm -f _meta/image-cache.json

      # .meta.json（稳定 id / 存档 sha256）、标签落位、预览图 / 缩略图、索引
      - name: Rebuild Metas, Placements, Images & Indexes
        run: node scripts/build.js

      - name: Commit Artifacts
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 自动重建元数据、索引与图片 [skip ci]"
          # 预览图 / 缩略图、_meta/image-cache.json 与索引）

      # 仅在产物有实际变更时通知网站库更新子模块指针并部署
      - name: Dispatch Website Update
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: |
          curl -sSf -X POST \
            -H "Authorization: Bearer ${{ secrets.SITE_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/OpenST-mc/website/dispatches \
            -d '{"event_type":"archive-update","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
